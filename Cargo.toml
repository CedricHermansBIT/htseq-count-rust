[package]
name = "tallyseq"
version = "0.1.0"
edition = "2021"
description = "Fast HTSeq-compatible genomic feature counting in Rust"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
ahash = "0.8.12"
clap = { version = "4.6.7", features = ["derive"] }
bam = "0.1.4"
rand = "0.10.3"
flate2 = "1.1.10"
rust-hdf5 = "0.5.2"
tempfile = "3.23.0"

[target.'cfg(unix)'.dependencies]
rust-htslib = "1.0.1"
