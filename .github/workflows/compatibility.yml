name: HTSeq compatibility surface

on:
  push:
    branches:
      - diagnostics
    paths:
      - "src/**"
      - "tests/compatibility_surface.py"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/compatibility.yml"
  workflow_dispatch:

jobs:
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTSeq and output readers
        run: |
          python -m pip install --upgrade pip
          python -m pip install HTSeq scipy anndata loompy

      - name: Build Rust release
        run: cargo build --release --locked

      - name: Run compatibility surface
        run: python tests/compatibility_surface.py --rust-bin target/release/htseq_count_rust
