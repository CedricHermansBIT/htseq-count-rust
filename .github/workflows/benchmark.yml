name: Real-data benchmark

on:
  push:
    branches:
      - main
      - diagnostics
    paths:
      - "benchmarks/benchmark_real_data.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      repeats:
        description: "Measured repeats per tool"
        required: false
        default: "3"
      profile:
        description: "Benchmark profile"
        required: false
        type: choice
        options:
          - full
          - core
        default: full
      both_datasets:
        description: "Benchmark both Pasilla chr4 BAMs"
        required: false
        type: boolean
        default: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTSeq
        run: |
          python -m pip install --upgrade pip
          python -m pip install HTSeq

      - name: Build Rust release
        run: cargo build --release --locked

      - name: Benchmark one real dataset
        if: ${{ github.event_name == 'push' || !inputs.both_datasets }}
        run: |
          REPEATS="${{ github.event_name == 'push' && '1' || inputs.repeats }}"
          PROFILE="${{ github.event_name == 'push' && 'full' || inputs.profile }}"
          python benchmarks/benchmark_real_data.py \
            --rust-bin target/release/tallyseq \
            --profile "$PROFILE" \
            --repeats "$REPEATS"

      - name: Benchmark both real datasets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.both_datasets }}
        run: |
          python benchmarks/benchmark_real_data.py \
            --rust-bin target/release/tallyseq \
            --profile "${{ inputs.profile }}" \
            --dataset GSM461177 \
            --dataset GSM461178 \
            --repeats "${{ inputs.repeats }}"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: real-data-benchmark
          path: |
            benchmarks/results/real_data_benchmark.json
            benchmarks/results/real_data_benchmark.md
            benchmarks/results/runs/*.time.tsv
            benchmarks/results/runs/*.stderr.txt
