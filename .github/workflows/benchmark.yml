name: Real-data benchmark

on:
  push:
    branches:
      - main
      - diagnostics
    paths:
      - "benchmarks/benchmark_real_data.py"
      - "benchmarks/benchmark_scaling.py"
      - ".github/workflows/benchmark.yml"
  workflow_dispatch:
    inputs:
      repeats:
        description: "Measured repeats per tool"
        required: false
        default: "3"
      profile:
        description: "Benchmark profile"
        required: false
        type: choice
        options:
          - full
          - core
        default: full
      both_datasets:
        description: "Benchmark both Pasilla chr4 BAMs"
        required: false
        type: boolean
        default: false
      rust_threads:
        description: "TallySeq BAM decoding threads"
        required: false
        default: "1"
      run_scaling:
        description: "Also run the 100k/1M/5M/10M scaling benchmark"
        required: false
        type: boolean
        default: false
      scaling_repeats:
        description: "Measured repeats per scaling target"
        required: false
        default: "3"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTSeq
        run: |
          python -m pip install --upgrade pip
          python -m pip install "HTSeq==2.1.2"

      - name: Build Rust release
        run: cargo build --release --locked

      - name: Benchmark one real dataset
        if: ${{ github.event_name == 'push' || !inputs.both_datasets }}
        run: |
          REPEATS="${{ github.event_name == 'push' && '1' || inputs.repeats }}"
          PROFILE="${{ github.event_name == 'push' && 'full' || inputs.profile }}"
          RUST_THREADS="${{ github.event_name == 'push' && '1' || inputs.rust_threads }}"
          python benchmarks/benchmark_real_data.py \
            --rust-bin target/release/tallyseq \
            --profile "$PROFILE" \
            --rust-threads "$RUST_THREADS" \
            --nprocesses 1 \
            --repeats "$REPEATS"

      - name: Benchmark both real datasets
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.both_datasets }}
        run: |
          python benchmarks/benchmark_real_data.py \
            --rust-bin target/release/tallyseq \
            --profile "${{ inputs.profile }}" \
            --dataset GSM461177 \
            --dataset GSM461178 \
            --rust-threads "${{ inputs.rust_threads }}" \
            --nprocesses 1 \
            --repeats "${{ inputs.repeats }}"

      - name: Run large-BAM scaling benchmark
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scaling }}
        run: |
          python benchmarks/benchmark_scaling.py \
            --rust-bin target/release/tallyseq \
            --rust-threads "${{ inputs.rust_threads }}" \
            --nprocesses 1 \
            --repeats "${{ inputs.scaling_repeats }}"

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: real-data-benchmark
          path: |
            benchmarks/results/real_data_benchmark.json
            benchmarks/results/real_data_benchmark.md
            benchmarks/results/runs/*.time.tsv
            benchmarks/results/runs/*.stderr.txt

      - name: Upload scaling report
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_scaling }}
        uses: actions/upload-artifact@v4
        with:
          name: scaling-benchmark
          path: |
            benchmarks/results/scaling_benchmark.json
            benchmarks/results/scaling_benchmark.md
            benchmarks/results/scaling_runs/*.time.tsv
            benchmarks/results/scaling_runs/*.stderr.txt
