name: Regenerate compatibility lockfile

on:
  push:
    branches:
      - diagnostics
    paths:
      - "Cargo.toml"
      - ".github/workflows/regenerate-lockfile.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics

      - name: Regenerate lockfile
        run: cargo generate-lockfile

      - name: Commit Cargo.lock
        run: |
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "Regenerate Cargo.lock for compatibility dependencies"
          git push origin HEAD:diagnostics
