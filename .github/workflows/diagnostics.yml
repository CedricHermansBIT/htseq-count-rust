name: Diagnostics parity

on:
  push:
    branches:
      - diagnostics
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install HTSeq reference
        run: |
          python -m pip install --upgrade pip
          python -m pip install HTSeq

      - name: Show reference version
        run: htseq-count --version

      - name: Build Rust release
        run: cargo build --release --locked

      - name: Run parity diagnostics
        run: python tests/parity_against_htseq.py --rust-bin target/release/htseq_count_rust --fuzz 150 --paired-fuzz 100

      - name: Run interval edge-case diagnostics
        run: python tests/parity_edge_cases.py --rust-bin target/release/htseq_count_rust

      - name: Check out HTSeq reference fixtures
        uses: actions/checkout@v4
        with:
          repository: htseq/htseq
          path: htseq-reference

      - name: Compare official HTSeq fixtures
        run: python tests/parity_htseq_reference_data.py --reference-dir htseq-reference --rust-bin target/release/htseq_count_rust
